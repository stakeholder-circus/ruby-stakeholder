name: docker-smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ruby-stakeholder .
      - run: docker run --rm ruby-stakeholder --list-values
      - run: docker run --rm ruby-stakeholder --focus-family code_analyzer --seed 41 --output-format json
      - run: '! docker run --rm ruby-stakeholder --experimental-provider openai-compatible'
