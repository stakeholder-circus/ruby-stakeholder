name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
      - run: ruby bin/ruby-stakeholder --list-values
      - run: ruby bin/ruby-stakeholder --focus-family code_analyzer --seed 41 --output-format json
