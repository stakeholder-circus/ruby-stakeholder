name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: '3.3'
      - run: ruby bin/ruby-stakeholder --list-values
      - run: ruby bin/ruby-stakeholder --focus-family code_analyzer --seed 41 --output-format json
